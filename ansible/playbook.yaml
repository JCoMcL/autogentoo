- hosts: localhost
  gather_facts: no
  tasks:
    - name: Ensure /mnt/gentoo exists before continuing
      stat:
        path: /mnt/gentoo
      register: gentoo_chroot

    - name: Abort if /mnt/gentoo is missing
      fail:
        msg: "/mnt/gentoo does not exist, you have probably missed a step."
      when: not gentoo_chroot.stat.exists

    - name: Copy gentoo setup files
      unarchive:
        src: ../stage3.tar.xz
        dest: /mnt/gentoo
        extra_opts:
          - --xattrs-include='*.*'
          - --numeric-owner
          - --preserve-permissions

    - name: Bootstrap Gentoo inside chroot
      block:

        - name: Sync portage tree
          command: emerge-webrsync

        - name: Allow self-configuring portage
          lineinfile:
            path: /etc/portage/make.conf
            line: 'CONFIG_PROTECT_MASK="/etc/portage"'

        - name: Configure binary packages
          copy:
            dest: /etc/portage/binrepos.conf/gentoobinhost.conf
            content: |
              [binhost]
              priority = 9999
              sync-uri = https://mirror.bytemark.co.uk/gentoo/releases/amd64/binpackages/17.1/x86-64/
        - name: confiugre binary packages 2
          blockinfile:
            path: /etc/portage/make.conf
            block: |
              # Binary package features
              FEATURES="${FEATURES} getbinpkg"
              FEATURES="${FEATURES} binpkg-request-signature"
              ACCEPT_LICENSE="*"

        - name: Install kernel and firmware
          command: emerge sys-kernel/gentoo-kernel-bin
          args:
            creates: /boot/vmlinuz

        - name: Generate fstab
          shell: genfstab -t PARTLABEL / | sed s/relatime/noatime/ > /etc/fstab

        - name: Set hostname
          copy:
            dest: /etc/hostname
            content: "autogentoo\n"
      vars:
        ansible_connection: community.general.chroot
        ansible_host: /mnt/gentoo
        ansible_chroot_exe: arch-chroot
